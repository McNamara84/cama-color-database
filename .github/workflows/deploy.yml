name: Deploy via Netcup Plesk Git
on:
  workflow_call:
    inputs:
      sha:
        description: Main commit tested and packaged by the calling CI run
        required: true
        type: string
    secrets:
      PLESK_WEBHOOK_URL:
        description: HTTPS webhook from the Plesk Git repository settings
        required: false
permissions:
  contents: write
concurrency:
  group: netcup-cama
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
      RELEASE_SHA: ${{ inputs.sha }}
      DEPLOY_ORIGIN: https://cama.cats4future.de
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          # Required only in this trusted main job to publish the deployment branch.
          persist-credentials: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ inputs.sha }}
          path: build
      - name: Publish the verified package to the deploy branch
        id: publish
        run: bash bin/publish-plesk "$RELEASE_SHA"
      - name: Explain first-time setup
        if: steps.publish.outputs.published == 'true' && env.PLESK_WEBHOOK_URL == ''
        run: |
          echo 'Deploy branch prepared. Hosting deployment is pending Plesk setup and PLESK_WEBHOOK_URL.' >> "$GITHUB_STEP_SUMMARY"
      - name: Ask Plesk to pull and deploy
        if: steps.publish.outputs.published == 'true' && env.PLESK_WEBHOOK_URL != ''
        run: bash bin/notify-plesk "$RELEASE_SHA"
