# Separate project and volume: never point MySQL at the MariaDB development data.
name: cama-color-database-mysql
services:
  db:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: cama
      # Environment reference; the password is loaded from the ignored .env file.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run bin/setup first} # ggignore
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h127.0.0.1 -uroot --silent -e "SELECT 1"']
      interval: 3s
      timeout: 3s
      retries: 60
  test:
    image: cama-color-database-test
    environment:
      APP_RUNTIME_DIR: /app/var/mysql-test
      XDEBUG_MODE: off
volumes:
  mysql-data:
